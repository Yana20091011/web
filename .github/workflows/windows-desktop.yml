name: Build Windows desktop pet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check desktop settings and key matching
        run: npm run test:desktop:unit

      - name: Check native window probe
        shell: pwsh
        run: |
          try {
            & ./tests/windows-layer-check.ps1 -PetHandle '0' -BrowserTitle 'KeyCritter diagnostic missing browser'
          } catch {
            Write-Output "::error title=Windows layer probe::$($_.Exception.Message)"
            exit 1
          }

      - name: Build portable Windows app
        run: npm run desktop:win

      - name: Verify the actual portable Windows app
        run: npm run test:portable

      - name: Prepare download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-download | Out-Null
          Copy-Item "release/KeyCritter-Windows-${{ steps.version.outputs.version }}.exe" windows-download/
          Copy-Item docs/WINDOWS-START-HERE.txt windows-download/START-HERE.txt
          Copy-Item release/package-verification.json windows-download/
          Copy-Item release/verified-ui.png windows-download/
          Copy-Item release/verified-ai-ui.png windows-download/
          Copy-Item release/verified-animation-ui.png windows-download/
          Get-FileHash windows-download/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content windows-download/SHA256SUMS.txt

      - name: Upload downloadable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KeyCritter-Windows-v${{ steps.version.outputs.version }}
          path: windows-download/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish public Windows download
    needs: windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: KeyCritter-Windows-v${{ needs.windows.outputs.version }}
          path: windows-download

      - name: Prepare stable public download names
        env:
          APP_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          # Check the executable transferred from the Windows verification job.
          (cd windows-download && sha256sum --check SHA256SUMS.txt)
          mkdir -p public-download
          cp "windows-download/KeyCritter-Windows-${APP_VERSION}.exe" public-download/KeyCritter-Windows.exe
          zip -j public-download/KeyCritter-Windows.zip windows-download/*
          (cd public-download && sha256sum KeyCritter-Windows.exe KeyCritter-Windows.zip > SHA256SUMS.txt)

      - name: Publish verified executable and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          tag="windows-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" public-download/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" public-download/* \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "KeyCritter for Windows v${APP_VERSION} (build ${GITHUB_RUN_NUMBER})" \
              --notes-file docs/WINDOWS-RELEASE.md --draft
          fi
          # Only make this the public latest release once all assets are uploaded.
          gh release edit "$tag" --draft=false --latest --repo "$GITHUB_REPOSITORY"
